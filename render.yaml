# Render deployment configuration
# This file tells Render how to deploy your FastAPI application

services:
  # Web service configuration
  - type: web
    name: fastapi-backend
    env: docker
    plan: free  # Use free tier for testing, upgrade to starter for production
    healthCheckPath: /health  # Health check endpoint for monitoring
    autoDeploy: true  # Automatically deploy on git push
    
    # Environment variables (add any sensitive data here)
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      - key: PORT
        value: 8000
